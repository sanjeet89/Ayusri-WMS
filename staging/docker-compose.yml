services:
    inventree-staging-db:
        image: postgres:17
        container_name: inventree-staging-db
        ports:
            - "5433:5432"
        expose:
            - ${INVENTREE_DB_PORT:-5432}/tcp
        environment:
            - PGDATA=/var/lib/postgresql/data/pgdb
            - POSTGRES_USER=${INVENTREE_DB_USER}
            - POSTGRES_PASSWORD=${INVENTREE_DB_PASSWORD}
            - POSTGRES_DB=${INVENTREE_DB_NAME}
        volumes:
            - ${INVENTREE_EXT_VOLUME}:/var/lib/postgresql/data/:z
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 20s
        restart: unless-stopped

    inventree-staging-cache:
        image: redis:7-alpine
        container_name: inventree-staging-cache
        command: redis-server --save "" --appendonly no
        env_file:
            - .env
        expose:
            - ${INVENTREE_CACHE_PORT:-6379}
        volumes:
            - ${INVENTREE_EXT_VOLUME}/redis:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 10s
        restart: always

    inventree-staging-server:
        image: inventree/inventree:${INVENTREE_TAG:-stable}
        container_name: inventree-staging-server
        expose:
            - ${INVENTREE_WEB_PORT:-8000}
        depends_on:
            inventree-staging-db:
                condition: service_healthy
            inventree-staging-cache:
                condition: service_healthy
        env_file:
            - .env
        environment:
          INVENTREE_SERVER: http://inventree-staging-server:${INVENTREE_WEB_PORT}
        volumes:
            - ${INVENTREE_EXT_VOLUME}:/home/inventree/data:z
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'invoke server-health --address "http://localhost:$${INVENTREE_WEB_PORT:-8000}"',
                ]
            interval: 20s
            timeout: 5s
            retries: 10
            start_period: 60s
        restart: unless-stopped

    inventree-staging-worker:
        image: inventree/inventree:${INVENTREE_TAG:-stable}
        container_name: inventree-staging-worker
        command: invoke worker
        depends_on:
            inventree-staging-server:
                condition: service_healthy
        env_file:
            - .env
        volumes:
            - ${INVENTREE_EXT_VOLUME}:/home/inventree/data:z
        healthcheck:
            test: ['CMD-SHELL', 'invoke worker-health']
            interval: 60s
            timeout: 10s
            retries: 3
            start_period: 180s
        restart: unless-stopped

    inventree-staging-proxy:
        container_name: inventree-staging-proxy
        image: caddy:alpine
        restart: always
        depends_on:
            inventree-staging-server:
                condition: service_healthy
            inventree-staging-worker:
                condition: service_healthy
        ports:
            - ${INVENTREE_HTTP_PORT:-8080}:80
            - ${INVENTREE_HTTPS_PORT:-8443}:443
        env_file:
            - .env
        healthcheck:
            test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:9090/api/system/health/']
            interval: 20s
            timeout: 5s
            retries: 10
            start_period: 20s
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
            - ${INVENTREE_EXT_VOLUME}/static:/var/www/static:z
            - ${INVENTREE_EXT_VOLUME}/media:/var/www/media:z
            - ${INVENTREE_EXT_VOLUME}:/var/log:z
            - ${INVENTREE_EXT_VOLUME}:/data:z
            - ${INVENTREE_EXT_VOLUME}:/config:z
